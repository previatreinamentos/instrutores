<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Previa Treinamentos</title>

  <!-- Cor da barra de navegação/status no celular -->
  <meta name="theme-color" content="#042e2a">

  <!-- 1. Ícone padrão para navegadores (Favicon) -->
  <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/pw/AP1GczOHQW3vNgak5n6o5ao_2xrU1jg939u8uya5WNvo9AcA8vATPtKCFkZ7yag8Z53i0T4y14Z4_kgtCSydvki-SqzzprLY09tnJTxG2tdbAgqJjv3fHNffJnHp2aRdyszqR6eMSL3iVpDPIQGRCrOoSp3y=w599-h599-s-no-gm?authuser=0">

  <!-- 2. Ícone para iOS (iPhone / iPad - Tela Inicial) -->
  <link rel="apple-touch-icon" sizes="180x180" href="https://lh3.googleusercontent.com/pw/AP1GczOHQW3vNgak5n6o5ao_2xrU1jg939u8uya5WNvo9AcA8vATPtKCFkZ7yag8Z53i0T4y14Z4_kgtCSydvki-SqzzprLY09tnJTxG2tdbAgqJjv3fHNffJnHp2aRdyszqR6eMSL3iVpDPIQGRCrOoSp3y=w599-h599-s-no-gm?authuser=0">

  <!-- Meta tags específicas do iOS para PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Previa">

  <!-- 3. Web App Manifest Gerado Dinamicamente -->
  <script>
    const myManifest = {
      "name": "Previa Treinamentos",
      "short_name": "Previa",
      "start_url": "./",
      "display": "standalone",
      "background_color": "#ffffff",
      "theme_color": "#042e2a",
      "icons": [
        {
          "src": "https://lh3.googleusercontent.com/pw/AP1GczOHQW3vNgak5n6o5ao_2xrU1jg939u8uya5WNvo9AcA8vATPtKCFkZ7yag8Z53i0T4y14Z4_kgtCSydvki-SqzzprLY09tnJTxG2tdbAgqJjv3fHNffJnHp2aRdyszqR6eMSL3iVpDPIQGRCrOoSp3y=w599-h599-s-no-gm?authuser=0",
          "sizes": "192x192",
          "type": "image/png",
          "purpose": "any maskable"
        },
        {
          "src": "https://lh3.googleusercontent.com/pw/AP1GczOHQW3vNgak5n6o5ao_2xrU1jg939u8uya5WNvo9AcA8vATPtKCFkZ7yag8Z53i0T4y14Z4_kgtCSydvki-SqzzprLY09tnJTxG2tdbAgqJjv3fHNffJnHp2aRdyszqR6eMSL3iVpDPIQGRCrOoSp3y=w599-h599-s-no-gm?authuser=0",
          "sizes": "512x512",
          "type": "image/png",
          "purpose": "any maskable"
        }
      ]
    };

    const stringManifest = JSON.stringify(myManifest);
    const blob = new Blob([stringManifest], {type: 'application/json'});
    const manifestURL = URL.createObjectURL(blob);
    const linkManifest = document.createElement('link');
    linkManifest.rel = 'manifest';
    linkManifest.href = manifestURL;
    document.head.appendChild(linkManifest);
  </script>

  <!-- Estilos da Página -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
      font-family: Arial, sans-serif;
    }

    /* Faixa Verde Superior de ~2cm sem sombra */
    .top-bar {
      width: 100%;
      height: 75px; 
      background-color: #042e2a;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-weight: bold;
      font-size: 1.1rem;
      text-align: center;
      padding: 0 10px;
    }

    /* Container para o Link Incorporado (iframe) */
    .content-frame {
      width: 100%;
      height: calc(100% - 75px);
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <!-- Faixa Verde no topo com o texto (#042e2a) -->
  <header class="top-bar">
    AUTOESCOLA DIGITAL PREVIA TREINAMENTOS
  </header>

  <!-- Substitua o atributo 'src' abaixo pelo link que você quer incorporar -->
  <iframe 
    class="content-frame" 
    src="https://script.google.com/macros/s/AKfycbxesZweK6_2-ljWAIJwb7WVi2HHsNqzTRZIXJa1ia39FGw-yJl_HlKh19FDS9cAK2AQow/exec" 
    title="Conteúdo Incorporado"
    allow="fullscreen">
  </iframe>

  <!-- 4. Registro do Service Worker (Necessário para PWA/Instalação) -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const swCode = `
          self.addEventListener('install', (e) => self.skipWaiting());
          self.addEventListener('activate', (e) => e.waitUntil(self.clients.claim()));
          self.addEventListener('fetch', (e) => {
            e.respondWith(fetch(e.request).catch(() => new Response('Sem conexão')));
          });
        `;
        const blob = new Blob([swCode], { type: 'application/javascript' });
        const swUrl = URL.createObjectURL(blob);

        navigator.serviceWorker.register(swUrl)
          .then(() => console.log('Service Worker registrado com sucesso.'))
          .catch(err => console.log('Erro ao registrar Service Worker:', err));
      });
    }
  </script>
</body>
</html>
